name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'SampleGifs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'SampleGifs/**'
  workflow_dispatch:

jobs:
  tests:
    name: Core tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm runs the tests natively on Arm64, with the bundled x64 ffmpeg.exe under emulation.
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run the tests
        run: dotnet test FluentDL.Core.Tests/FluentDL.Core.Tests.csproj -c Release

  build:
    name: App build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the app
        run: dotnet build FluentDL/FluentDL.csproj -c Release -p:Platform=${{ matrix.platform }} -p:GenerateAppxPackageOnBuild=false
      - name: Check that the native binaries match the platform
        shell: pwsh
        # ffmpeg.exe is x64 in every build for now. The WebView2 package copies its x86 Core component into both
        # builds; the app doesn't load it.
        run: >
          ./.github/scripts/Test-NativeArchitecture.ps1
          -Folder FluentDL/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.22621.0/win-${{ matrix.platform }}
          -Architecture ${{ matrix.platform }}
          -Allow 'Assets\ffmpeg\bin\ffmpeg.exe', 'Microsoft.Web.WebView2.Core.dll'

  package:
    name: Sideload package (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Test packages take the manifest's version with this run's number as the last part, such as 3.8.0.57, so
      # About shows which run built them and they install as an upgrade over a sideloaded release.
      - name: Choose the test version
        run: |
          $parts = ([xml](Get-Content FluentDL/Package.appxmanifest)).Package.Identity.Version.Split('.')
          "VERSION=$($parts[0]).$($parts[1]).$($parts[2]).${{ github.run_number }}" >> $env:GITHUB_ENV
      - name: Build the package
        working-directory: FluentDL
        run: dotnet run --file PackageSelect/BuildPackages.cs -- --version $env:VERSION --channel Sideload --architecture ${{ matrix.architecture }} --no-sandbox --output "${{ runner.temp }}/packages"
      # archive: false stores the ZIP as it is, so the run page offers FluentDL_<version>_<arch>.zip instead of a ZIP
      # inside another ZIP. The artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/packages/${{ env.VERSION }}/Sideload/FluentDL_${{ env.VERSION }}_${{ matrix.architecture }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  launch:
    name: Launch (${{ matrix.architecture }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # skip-decompress keeps the ZIP as it is, the same way the release job downloads it.
      - uses: actions/download-artifact@v8
        with:
          pattern: FluentDL_*_${{ matrix.architecture }}.zip
          path: package
          merge-multiple: true
          skip-decompress: true
      - name: Install and start FluentDL
        shell: powershell
        run: |
          $zip = Get-ChildItem package -Filter 'FluentDL_*_${{ matrix.architecture }}.zip' | Select-Object -First 1
          if (-not $zip) { throw "No FluentDL ZIP was downloaded. The package folder has: $((Get-ChildItem package).Name -join ', ')" }
          Expand-Archive $zip.FullName -DestinationPath package/unzipped
          $msix = Get-ChildItem package/unzipped -Recurse -Filter *.msix | Select-Object -First 1
          ./.github/scripts/Test-AppLaunch.ps1 -Package $msix.FullName -Architecture ${{ matrix.architecture }} -Output launch-results
      - name: Upload the launch results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.architecture }}-launch-results
          path: launch-results
          retention-days: 14
